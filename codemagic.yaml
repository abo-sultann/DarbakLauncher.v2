workflows:
  darbak-android-debug:
    name: Darbak Launcher Android 7 Debug
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Restore Android project
        script: |
          base64 --decode darbak_project.tgz.b64 > /tmp/darbak_project.tgz
          tar -xzf /tmp/darbak_project.tgz
      - name: Install Gradle 8.7
        script: |
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.7/bin:$PATH"
          gradle --version
      - name: Build debug APK
        script: |
          export PATH="/tmp/gradle-8.7/bin:$PATH"
          gradle --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**
