name: Build Launcher 2026 APK

on:
  push:
    branches: [ main, darbak-platform-v1, dev/launcher-refresh, feature/widget-redesign-chatgpt, test-v2-widget-redesign-side-by-side ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: launcher-2026-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore fixed signing key
        run: |
          base64 --decode ci/launcher-stable.jks.b64 > app/launcher-stable.jks
          keytool -list -keystore app/launcher-stable.jks -storepass android -alias androiddebugkey >/dev/null

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run full unit test suite
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Record 1024x600 Roborazzi widget screenshots
        run: ./gradlew :app:recordRoborazziDebug --stacktrace --no-daemon

      - name: Build signed redesign APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/launcher-stable.jks
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload redesign APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakLauncher-v2-WIDGET-RC1-side-by-side
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload widget screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DarbakLauncher-v2-WIDGET-RC1-screenshots
          path: app/src/test/screenshots/*.png
          if-no-files-found: warn
          retention-days: 1
