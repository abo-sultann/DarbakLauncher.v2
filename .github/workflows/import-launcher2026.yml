name: Import Launcher.2026 snapshot

on:
  push:
    paths:
      - '.github/workflows/import-launcher2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source snapshot
        run: |
          rm -rf /tmp/launcher2026
          git clone --depth 1 --branch main https://github.com/abo-sultann/Launcher.2026.git /tmp/launcher2026

      - name: Replace destination working tree with source snapshot
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/launcher2026/. .
          rm -rf .git
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/launcher2026/. .
          rm -rf .git

      - name: Commit imported snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import working Launcher.2026 snapshot"
          git push origin main
