name: Import Launcher.2026 snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source snapshot
        run: |
          rm -rf /tmp/launcher2026
          git clone --depth 1 --branch main https://github.com/abo-sultann/Launcher.2026.git /tmp/launcher2026

      - name: Replace destination with source snapshot
        run: |
          rsync -a --delete --exclude='.git/' /tmp/launcher2026/ ./

      - name: Commit imported snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import working Launcher.2026 snapshot"
          git push origin main
