name: Probe old launcher update endpoint

on:
  push:
    branches: [ diagnostic/update-endpoint ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe old Google Drive manifest
        run: |
          set -euxo pipefail
          URL='https://drive.google.com/uc?export=download&id=15Ki1PBf0_erdbITrYh8k80Kt4rWC5yLi'
          curl -L --fail-with-body --silent --show-error -D /tmp/headers.txt "$URL" -o /tmp/body.bin || true
          echo '--- headers ---'
          cat /tmp/headers.txt || true
          echo '--- file ---'
          file /tmp/body.bin || true
          echo '--- bytes ---'
          wc -c /tmp/body.bin || true
          echo '--- body ---'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/body.bin')
          if p.exists():
              print(p.read_bytes()[:10000].decode('utf-8','replace'))
          PY
