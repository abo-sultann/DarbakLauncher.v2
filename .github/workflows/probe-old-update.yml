name: Probe launcher Drive update endpoint

on:
  push:
    branches: [ diagnostic/update-endpoint ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Google Drive manifest and APK without authentication
        run: |
          set -euxo pipefail
          MANIFEST='https://drive.google.com/uc?export=download&id=1Reqp8Au2ityF6ZhZTRAZymzxn7FshLym'
          APK='https://drive.google.com/uc?export=download&id=1-TeGnxbuSDgHSvDuLeHBqcgLXkCF4eTr'

          echo '--- MANIFEST ---'
          curl -L --fail-with-body --silent --show-error -D /tmp/manifest.headers "$MANIFEST" -o /tmp/manifest.bin
          cat /tmp/manifest.headers
          file /tmp/manifest.bin
          cat /tmp/manifest.bin
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/manifest.bin').read_text('utf-8')
          obj=json.loads(raw)
          assert obj['versionCode'] >= 20300
          assert obj['apkUrl']
          print('manifest-ok')
          PY

          echo '--- APK ---'
          curl -L --fail-with-body --silent --show-error -D /tmp/apk.headers "$APK" -o /tmp/apk.bin
          cat /tmp/apk.headers
          file /tmp/apk.bin
          wc -c /tmp/apk.bin
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apk.bin')
          b=p.read_bytes()[:4]
          assert b[:2] == b'PK', b
          assert p.stat().st_size > 1000000
          print('apk-ok')
          PY
